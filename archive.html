<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makale Arşivi | NebChat</title>
  <meta name="description" content="NebChat siber güvenlik makale arşivi. Kategori filtresi, arama ve popülerlik sıralamasıyla içerik keşfedin.">
  <link rel="canonical" href="https://nebchat.online/archive.html">
  <meta property="og:title" content="Makale Arşivi | NebChat"><meta property="og:type" content="website">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header" data-site-header></header>
<main class="container">
  <section class="section">
    <h1>Makale Arşivi</h1>
    <p class="lead">Yayınlanan tüm içerikleri kategori, anahtar kelime ve popülerlik sinyaline göre filtreleyin.</p>
    <form id="archiveForm" class="searchbar">
      <input id="searchInput" type="search" placeholder="Örn: ransomware, CVE, veri ihlali">
      <select id="sortInput"><option value="newest">En yeni</option><option value="popular">En popüler</option></select>
      <button class="btn primary" type="submit">Uygula</button>
    </form>
    <div id="categoryFilters" class="searchbar"></div>
    <div id="archiveList" class="grid-3"></div>
    <div style="margin-top:1rem;"><button id="loadMoreBtn" class="btn ghost hidden">Daha fazla yükle</button></div>
  </section>
</main>
<footer class="site-footer" data-site-footer></footer>
<script type="module">
  import('./js/archive.js').catch(async (error) => {
    console.warn('Ana arşiv modülü yüklenemedi, seed fallback UI gösteriliyor:', error);
    const [{ SEED_ARTICLES, CATEGORY_LIST }, common] = await Promise.all([
      import('./js/content.js'),
      import('./js/common.js')
    ]);

    common.injectHeaderFooter();
    common.initAuthNav();

    const params = new URLSearchParams(location.search);
    const searchInput = document.getElementById('searchInput');
    const sortInput = document.getElementById('sortInput');
    const categoryFilters = document.getElementById('categoryFilters');
    const archiveList = document.getElementById('archiveList');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    let shown = 6;

    const normalizeRows = () => SEED_ARTICLES.map((article, idx) => ({
      ...article,
      publishedAtDate: article.publishedAt ? new Date(article.publishedAt) : new Date(Date.now() - idx * 86400000),
      views: article.views || 0
    }));

    const render = () => {
      const category = params.get('category') || '';
      const search = (params.get('q') || '').toLowerCase();
      const sort = params.get('sort') || 'newest';

      searchInput.value = params.get('q') || '';
      sortInput.value = sort;

      categoryFilters.innerHTML = [`<a class="category-chip ${!category ? 'active' : ''}" href="archive.html">Tümü</a>`]
        .concat(CATEGORY_LIST.map((c) => `<a class="category-chip ${category === c.slug ? 'active' : ''}" href="archive.html?category=${c.slug}">${c.name}</a>`))
        .join('');

      let rows = normalizeRows();
      if (category) rows = rows.filter((r) => r.category === category);
      if (search) rows = rows.filter((r) => [r.title, r.excerpt, ...(r.tags || [])].join(' ').toLowerCase().includes(search));
      if (sort === 'popular') rows.sort((a, b) => (b.views || 0) - (a.views || 0));

      archiveList.innerHTML = rows.slice(0, shown).map((a) => `
        <article class="card article-card">
          <span class="badge">${a.category}</span>
          <h3><a href="article.html?slug=${a.slug}">${a.title}</a></h3>
          <p>${a.excerpt}</p>
          <div class="meta"><span>${a.authorName}</span><span>${a.readingTime || 5} dk okuma</span></div>
        </article>
      `).join('') || '<div class="card">Sonuç bulunamadı.</div>';

      loadMoreBtn.classList.toggle('hidden', rows.length <= shown);
    };

    document.getElementById('archiveForm').addEventListener('submit', (e) => {
      e.preventDefault();
      params.set('q', searchInput.value.trim());
      params.set('sort', sortInput.value);
      history.replaceState({}, '', `archive.html?${params.toString()}`);
      shown = 6;
      render();
    });

    loadMoreBtn.addEventListener('click', () => {
      shown += 6;
      render();
    });

    render();
  });
</script>
</body>
</html>
