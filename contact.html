<!DOCTYPE html><html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<header class="site-header" data-site-header></header>
<main class="container"><section class="section grid-2">
<div class="article-body"><h1>İletişim</h1><p>Editoryal iş birlikleri, sponsorluk ve kurum içi güvenlik araştırmaları için bize ulaşın.</p>
<div class="card"><strong>E-posta</strong><p class="muted">hello@nebchat.online</p></div>
<div class="card"><strong>İş birliği</strong><p class="muted">Kurumsal raporlama ve sektör analiz ortaklıkları</p></div></div>
<form id="contactForm" class="panel" data-endpoint="https://formspree.io/f/xzzgrzqy"><h2>Mesaj formu</h2>
<input name="name" placeholder="Ad Soyad" required>
<input name="email" type="email" placeholder="E-posta" required>

<textarea name="message" placeholder="Mesajınız" required></textarea>
<button class="btn primary" type="submit">Gönder</button>
<div id="contactStatus" class="notice" style="margin-top:.8rem;">Mesajınız editör ekibine güvenli biçimde iletilir.</div>
</form>
</section></main>
<footer class="site-footer" data-site-footer></footer>
